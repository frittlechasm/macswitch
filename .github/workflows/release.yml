name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Verify release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the vMAJOR.MINOR.PATCH format: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          bundle_version="$(awk '
            /<key>CFBundleShortVersionString<\/key>/ {
              getline
              gsub(/.*<string>|<\/string>.*/, "")
              print
              exit
            }
          ' scripts/build-app-bundle.sh)"

          if [[ "$version" != "$bundle_version" ]]; then
            echo "Tag version $version does not match bundle version $bundle_version" >&2
            exit 1
          fi

      - name: Test
        run: scripts/test.sh

      - name: Build release executable
        run: swift build --configuration release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release already exists: $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" \
              --generate-notes \
              --title "$GITHUB_REF_NAME" \
              --verify-tag
          fi
